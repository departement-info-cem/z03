name: Déploiement

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache-dependency-path: "**/package-lock.json"
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tester les contrôles des archives R8
        run: python3 -m unittest discover -s scripts/tests -p 'test_rencontre8.py'

      - name: Vérifier les quatre ZIP R8 versionnés
        run: python3 scripts/verifier_zip_rencontre8.py

      - name: Installer les dépendances
        working-directory: ./web
        run: npm ci

      - name: Vérifier les types
        working-directory: ./web
        run: npm run typecheck

      - name: Build du site
        working-directory: ./web
        run: npm run build

      - name: Vérifier les ZIP R8 dans le site construit
        run: python3 scripts/verifier_zip_rencontre8.py --build-dir web/build

      - name: Corriger les permissions
        working-directory: ./web/build
        run: |
          chmod -c -R +rX "./" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Téléverser l'artéfact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/build

  deploy:
    name: Déployer le site
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
